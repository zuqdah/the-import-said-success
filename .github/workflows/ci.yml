name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  powershell:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tooling
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -MinimumVersion 1.22.0 -Force

      # Two things have to be true before a clean scan means anything: the
      # analyzer has to load, and it has to actually run. A crashed analyzer
      # reports zero findings, which reads exactly like clean code -- and on a
      # sibling lab PSScriptAnalyzer threw on its first path-based invocation
      # and worked on every call after. So a snippet with two known violations
      # is scanned first: it proves the analyzer still catches what it should,
      # and being the first call it absorbs that warm-up.
      #
      # Both rules are platform-independent on purpose. The obvious canary is
      # an aliased `ls`, and PSAvoidUsingCmdletAliases does not fire for it on
      # Linux where ls is a real binary -- a check that would pass on a
      # developer's Windows machine and fail only here.
      - name: Prove the analyzer works, then scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer -ErrorAction Stop
          if (-not (Get-Command Invoke-ScriptAnalyzer -ErrorAction SilentlyContinue)) {
            throw 'PSScriptAnalyzer did not load. A scan that cannot run must fail, not pass quietly.'
          }
          Write-Host "PSScriptAnalyzer $((Get-Module PSScriptAnalyzer).Version) on PowerShell $($PSVersionTable.PSVersion)"

          $canary = @(
            'function Do-Canary {'
            '    $neverUsed = ''deliberate'''
            '    return 1'
            '}'
          ) -join "`n"

          $found = @()
          foreach ($attempt in 1..3) {
            try { $found = @(Invoke-ScriptAnalyzer -ScriptDefinition $canary -ErrorAction Stop); break }
            catch { Write-Host "Canary attempt $attempt failed: $($_.Exception.Message)"; if ($attempt -eq 3) { throw } }
          }
          foreach ($rule in 'PSUseDeclaredVarsMoreThanAssignments', 'PSUseApprovedVerbs') {
            if ($rule -notin $found.RuleName) {
              throw "The analyzer did not report '$rule' against code that violates it. A clean result on real code would prove nothing."
            }
          }
          Write-Host 'Canary caught both rules. The analyzer is working.'

          $results = @()
          $results += Invoke-ScriptAnalyzer -Path module -Recurse -ErrorAction Stop
          $results += Invoke-ScriptAnalyzer -Path scripts -Recurse -ErrorAction Stop
          $results += Invoke-ScriptAnalyzer -Path tests -Recurse -ErrorAction Stop `
            -ExcludeRule PSReviewUnusedParameter, PSUseShouldProcessForStateChangingFunctions
          if ($results.Count) {
            $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message |
              Out-String -Width 200 | Write-Host
            throw "PSScriptAnalyzer reported $($results.Count) issue(s)."
          }
          Write-Host 'PSScriptAnalyzer is clean.'

      - name: Test
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'testResults.xml'
          Invoke-Pester -Configuration $config

      # The matrix is the yardstick, and an incoherent one would make the drill
      # unfalsifiable while its report still looked rigorous. Checked here so it
      # fails in seconds rather than after touching two environments.
      - name: Check the matrix is coherent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./module/SolutionLayers/SolutionLayers.psm1 -Force
          $matrix = Get-LayerMatrix -Path layer-matrix.json

          $guards = @($matrix.guards)
          $diverging = @($guards | Where-Object { $_.expectDefault -ne $_.expectOverwrite })
          Write-Host "$($guards.Count) guards, $($diverging.Count) changed by the remediation, $(@($matrix.assertions).Count) assertions."

          @(
            '### Layer matrix'
            ''
            "**$($guards.Count)** guards, graded in both passes, plus **$(@($matrix.assertions).Count)** assertions about the observable signals."
            ''
            "Changed by ``OverwriteUnmanagedCustomizations``: $(($diverging.id) -join ', ')"
          ) | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: testResults.xml
          if-no-files-found: warn

  actions:
    name: Lint the workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color
